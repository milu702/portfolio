<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d20" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#g1)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <text x="50" y="70" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff">CARDORA // AGRO-CLIMATIC TELEMETRY</text>
  <text x="50" y="100" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00e5ff">SYSTEM ARCHITECTURE &amp; WEATHER INFERENCE ENGINE</text>
  
  <!-- Flow Diagram Nodes -->
  <!-- Node 1: Weather Telemetry API -->
  <rect x="50" y="180" width="200" height="110" rx="14" fill="#0b1736" stroke="#00e5ff" stroke-width="1.5" />
  <text x="70" y="215" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Weather API Stream</text>
  <text x="70" y="240" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Temp · Humidity · Rain</text>
  <text x="70" y="260" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Real-time Polling</text>
  
  <!-- Arrow 1 to 2 -->
  <line x1="250" y1="235" x2="310" y2="235" stroke="url(#cyanLine)" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="310,230 320,235 310,240" fill="#00e5ff" />
  
  <!-- Node 2: Rule Engine -->
  <rect x="320" y="160" width="220" height="150" rx="14" fill="#0e1f4d" stroke="#818cf8" stroke-width="2" />
  <text x="340" y="195" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Rule Engine &amp; DSS</text>
  <text x="340" y="220" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Irrigation Thresholds</text>
  <text x="340" y="240" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Azukal / Blight Warning</text>
  <text x="340" y="260" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Nutrient Dosage Calc</text>
  <text x="340" y="285" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#818cf8">Deterministic Logic</text>
  
  <!-- Arrow 2 to 3 -->
  <line x1="540" y1="235" x2="600" y2="235" stroke="url(#cyanLine)" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="600,230 610,235 600,240" fill="#00e5ff" />

  <!-- Node 3: React Dashboard & Reports -->
  <rect x="610" y="180" width="140" height="110" rx="14" fill="#0b1736" stroke="#00e5ff" stroke-width="1.5" />
  <text x="630" y="215" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Farmer UI</text>
  <text x="630" y="240" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Live Advisories</text>
  <text x="630" y="260" font-family="'JetBrains Mono', monospace" font-size="11" fill="#00e5ff">PDF Dossier</text>

  <!-- Node 4: Plot Verification & Geo Mapping (Bottom) -->
  <rect x="180" y="380" width="440" height="120" rx="16" fill="#081329" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
  <text x="210" y="415" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" fill="#ffffff">Plot Boundary &amp; Geospatial Verification</text>
  <text x="210" y="440" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Latitude: 9.7499° N · Longitude: 77.1354° E (Idukki High Ranges)</text>
  <text x="210" y="465" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00e5ff">Status: Field Calibrated // Amal Jyothi College of Engineering</text>
</svg>
