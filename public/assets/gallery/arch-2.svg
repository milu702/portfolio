      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ffc46b" />
    </linearGradient>
  </defs>
  <rect width="800" height="600" rx="24" fill="url(#bg2)" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
  
  <text x="50" y="70" font-family="'Cinzel', Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff">GROWGUIDE // AWS CLOUD PIPELINE</text>
  <text x="50" y="100" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ff9900">MACHINE LEARNING INFERENCE ON AWS CLOUD</text>

