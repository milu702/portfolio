<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070f22" />
      <stop offset="50%" stop-color="#0b1736" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Outer Frame -->
  <rect width="400" height="400" rx="40" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  
  <!-- Glowing Core -->
  <circle cx="200" cy="200" r="140" fill="url(#glow)" />
  
  <!-- Tech Ring -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="200" cy="200" r="95" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
  
  <!-- Monogram MJ -->
  <text x="200" y="222" font-family="'Cinzel', Georgia, serif" font-size="76" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">MJ</text>
  
  <!-- Subtext -->
  <text x="200" y="270" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#00e5ff" text-anchor="middle" letter-spacing="3">SOFTWARE DEVELOPER</text>
  
  <!-- Corner Tech Accents -->
  <path d="M 40 70 L 40 40 L 70 40" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8" />
  <path d="M 330 40 L 360 40 L 360 70" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8" />
  <path d="M 40 330 L 40 360 L 70 360" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8" />
  <path d="M 330 360 L 360 360 L 360 330" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8" />
</svg>
